name: Сборка и публикация сайта

# Сайт пересобирается из исходников при каждом push в main и по кнопке Run workflow.
# Код R в отчётах выполняется заново, поэтому сайт подтверждает, что результаты воспроизводятся.
on:
  push:
    branches: [main]        # если основная ветка называется master — замените
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8         # отчёт проверяет, что локаль поддерживает кириллицу
      LC_ALL: C.UTF-8
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v7

      - name: Установить Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Установить R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Установить knitr и rmarkdown
        # Расчёты в отчёте используют только базовый R; эти пакеты нужны Quarto для выполнения кода.
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown"))'

      - name: Запомнить дату сборки и короткий хеш коммита
        run: |
          echo "BUILD_DATE=$(date -u +'%d.%m.%Y %H:%M UTC')" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Отрендерить сайт
        run: quarto render

      - name: Подготовить GitHub Pages
        uses: actions/configure-pages@v5

      - name: Загрузить собранный сайт
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
